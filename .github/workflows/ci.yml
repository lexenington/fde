name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    name: Console simulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: console/sim/requirements.txt
      - run: pip install -r console/sim/requirements.txt
      # Scripted fakes stand in for Claude, so this needs no API key. It builds the 140-page policy once (~30 s).
      - run: python -m pytest -q
        working-directory: console/sim

  labs:
    name: Lab grader tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Tests the grader itself, so a scoring change can't silently move your numbers. No API key needed.
      - run: python -m pytest -q
        working-directory: 02-technical-depth/03-ai-engineering/lab

  console-ui:
    name: Console UI type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/ui/package-lock.json
      - run: npm ci
        working-directory: console/ui
      - run: npx tsc --noEmit
        working-directory: console/ui
      - run: npm run build
        working-directory: console/ui
