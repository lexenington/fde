# FDE Field Console: the customer's world on your machine.
#   docker compose up --build      then open http://localhost:3300
# Your own app (the lab work) runs OUTSIDE this stack, on your machine, port 8000 by default.

services:
  keycloak:
    image: keycloak/keycloak:26.4   # also published as quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always carry this issuer, whether they were fetched from your machine or from inside Docker
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  lakeside-db:        # Lakeside Clinics' legacy booking database (engagement 1). Seeded by the simulator on startup
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: lakeside-admin
      POSTGRES_DB: lakeside
    ports:
      - "${LAKESIDE_DB_PORT:-5433}:5432"   # set LAKESIDE_DB_PORT in console/.env if 5433 is taken on your machine

  sim:
    build: ./sim
    environment:
      LEARNER_URL: ${LEARNER_URL:-http://host.docker.internal:8000}
      LABS_DIR: /labs
      PRACTICE_DIR: /practice
      KATAS_DIR: /katas
      ENGAGEMENTS_DIR: /engagements
      SAVANNA_DIR: /data/savanna
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # export it before `docker compose up`; needed for stakeholder chat and card feedback
      # FDE_CHAT_MODEL / FDE_JUDGE_MODEL default to claude-opus-5-5; set claude-sonnet-5-5 here to cut cost
      CRM_API_KEY: ${CRM_API_KEY:-crm-dev-key}
      CRM_WEBHOOK_SECRET: ${CRM_WEBHOOK_SECRET:-whsec_dev_adom}
      SCIM_TOKEN: ${SCIM_TOKEN:-scim-dev-token}
      LAKESIDE_DB_PORT: ${LAKESIDE_DB_PORT:-5433}   # the host port shown to you for Lakeside's database
    ports:
      - "8090:8090"
      - "2222:2222"       # Savanna's SFTP drop (core banking's nightly export)
    volumes:
      - ../02-technical-depth:/labs   # checker runs and inject-card replies are written into each lab's folder
      - ../katas:/katas:ro   # the sim runs your kata tests; it never writes here
      - ../03-customer-craft/practice:/practice   # call transcripts and debriefs
      - ../04-engagements:/engagements            # acceptance-test runs are written into each engagement's folder
      - ./.savanna-data:/data/savanna             # Savanna's generated documents and exports (rebuilt automatically)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; Docker Desktop already has it
    depends_on:
      - keycloak
      - lakeside-db

  ui:
    build: ./ui
    environment:
      SIM_INTERNAL_URL: http://sim:8090
      REPO_DIR: /repo
    ports:
      - "3300:3000"
    volumes:
      - ..:/repo:ro   # the Console reads lab briefs and PROGRESS.md straight from this repo
    depends_on:
      - sim
